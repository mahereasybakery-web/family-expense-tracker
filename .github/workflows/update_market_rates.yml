name: Auto Update Market Rates (Currencies & Gold)

on:
  schedule:
    # Runs hourly 24/7 so rates never freeze
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Live Rates (Multi-Tier Robust Engine)
        run: |
          python scripts/fetch_ta3weem_rates.py

      - name: Commit and Push Updated Rates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_rates.json
          if git diff --staged --quiet; then
            echo "No market rate changes to commit."
          else
            git commit -m "chore(rates): Auto-update live currency & gold rates [skip ci]"
            git push
          fi
