name: Daily 12:00 PM Google Drive Backup & Retention

on:
  schedule:
    # 09:00 UTC = 12:00 PM Noon Cairo/Riyadh (UTC+3)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Daily 12:00 PM Backup & Delete Previous Day
        run: |
          python scripts/daily_noon_backup.py

      - name: Commit and Push Daily Backup to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No backup changes to commit."
          else
            git commit -m "chore(backup): Daily 12:00 PM backup to Google Drive & Git with previous day cleanup [skip ci]"
            git push
          fi
